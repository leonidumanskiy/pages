<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civics Test Flashcards — 2025</title>
<style>
  :root {
    --ink: #1a2332;
    --paper: #f7f4ec;
    --navy: #16243f;
    --navy-soft: #243a5e;
    --red: #9e1b32;
    --gold: #b08d3f;
    --line: #d6cdba;
    --green: #2e6b4f;
    --muted: #6b6452;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 1.25rem;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    text-align: center;
    border-bottom: 3px double var(--navy);
    padding-bottom: 1rem;
    margin-bottom: 1.25rem;
  }
  .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    font-size: 0.62rem;
    color: var(--red);
    font-weight: 700;
  }
  h1 {
    font-size: 1.85rem;
    color: var(--navy);
    letter-spacing: 0.01em;
    margin: 0.35rem 0 0.15rem;
    line-height: 1.1;
  }
  .stars { color: var(--gold); letter-spacing: 0.5em; font-size: 0.7rem; margin-top: 0.3rem; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .seg {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border: 1.5px solid var(--navy);
    background: transparent;
    color: var(--navy);
    padding: 0.42rem 0.8rem;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .seg:hover { background: rgba(22,36,63,0.06); }
  .seg.active { background: var(--navy); color: var(--paper); }

  .meta {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
  }
  .progress-track { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 1.25rem; }
  .progress-fill { height: 100%; background: var(--red); transition: width 0.3s; width: 0; }

  /* Card */
  .card {
    position: relative;
    perspective: 1600px;
    height: 340px;
    margin-bottom: 1.1rem;
  }
  .card-inner {
    position: absolute;
    inset: 0;
    transition: transform 0.55s cubic-bezier(.2,.7,.2,1);
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 6px;
    padding: 1.6rem 1.5rem;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px -16px rgba(22,36,63,0.45);
  }
  .face-front { background: #fffdf7; }
  .face-back { background: var(--navy); color: var(--paper); transform: rotateY(180deg); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .face-front .qnum { color: var(--red); font-weight: 700; }
  .face-front .cat { color: var(--muted); text-align: right; max-width: 60%; }
  .face-back .qnum { color: var(--gold); font-weight: 700; }
  .star-badge { color: var(--gold); }

  .q-text {
    font-size: 1.32rem;
    line-height: 1.4;
    color: var(--navy);
    flex: 1;
    display: flex;
    align-items: center;
  }
  .face-back .a-label {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.6rem;
  }
  .a-list { flex: 1; overflow-y: auto; }
  .a-list ul { list-style: none; }
  .a-list li {
    font-size: 1.04rem;
    line-height: 1.45;
    padding: 0.28rem 0 0.28rem 1.1rem;
    position: relative;
  }
  .a-list li::before {
    content: "★";
    position: absolute;
    left: 0;
    color: var(--gold);
    font-size: 0.65rem;
    top: 0.5rem;
  }
  .a-note {
    font-size: 0.82rem;
    font-style: italic;
    color: #c9bfa6;
    margin-top: 0.7rem;
    line-height: 1.4;
  }
  .flip-hint {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.58rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-top: 0.8rem;
  }
  .face-back .flip-hint { color: #8b9bb5; }

  /* nav */
  .nav { display: flex; gap: 0.6rem; align-items: stretch; }
  .nav button {
    flex: 1;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border: 1.5px solid var(--navy);
    background: var(--navy);
    color: var(--paper);
    padding: 0.7rem;
    cursor: pointer;
    border-radius: 3px;
    transition: opacity 0.15s;
  }
  .nav button:hover { opacity: 0.88; }
  .nav button:disabled { opacity: 0.3; cursor: default; }
  .nav .know {
    flex: 0 0 auto;
    background: transparent;
    color: var(--green);
    border-color: var(--green);
    min-width: 120px;
  }
  .nav .know.marked { background: var(--green); color: var(--paper); }

  .footnote {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    font-size: 0.66rem;
    color: var(--muted);
    margin-top: 1.4rem;
    line-height: 1.6;
    border-top: 1px solid var(--line);
    padding-top: 0.9rem;
  }
  @media (max-width: 480px) {
    .q-text { font-size: 1.12rem; }
    .card { height: 360px; }
    .nav .know { min-width: 92px; font-size: 0.68rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">U.S. Naturalization — 2025 Civics Test</div>
    <h1>128 Questions</h1>
    <div class="stars">★ ★ ★ ★</div>
  </header>

  <div class="controls" id="controls">
    <button class="seg active" data-filter="all">All 128</button>
    <button class="seg" data-filter="star">65/20 (★ only)</button>
    <button class="seg" data-filter="unknown">Still learning</button>
    <button class="seg" data-filter="shuffle">Shuffle</button>
  </div>

  <div class="meta" id="meta"></div>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>

  <div class="card" id="card">
    <div class="card-inner" id="cardInner">
      <div class="face face-front">
        <div class="card-top">
          <span class="qnum" id="frontNum"></span>
          <span class="cat" id="frontCat"></span>
        </div>
        <div class="q-text" id="qText"></div>
        <div class="flip-hint">Tap card to reveal answer</div>
      </div>
      <div class="face face-back">
        <div class="card-top">
          <span class="qnum" id="backNum"></span>
          <span class="star-badge" id="backStar"></span>
        </div>
        <div class="a-label">Accepted Answers</div>
        <div class="a-list" id="aList"></div>
        <div class="flip-hint">Tap to see question</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button id="prev">‹ Prev</button>
    <button class="know" id="know">Got it ✓</button>
    <button id="next">Next ›</button>
  </div>

  <div style="text-align:center;margin-top:1.2rem;">
    <button class="seg" id="reset">Reset progress</button>
  </div>

  <div class="footnote" id="foot"></div>
</div>

const STORAGE_KEY = "civics-flashcards-v1";
let known = {};
let deck = [];
let idx = 0;
let filter = "all";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      known = saved.known || {};
      filter = saved.filter || "all";
    }
  } catch (e) { /* storage unavailable (e.g. artifact preview) — start fresh */ }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ known: known, filter: filter }));
  } catch (e) { /* storage unavailable — progress just won't persist */ }
}

const card = document.getElementById('card');
const cardInner = document.getElementById('cardInner');

function buildDeck() {
  let base = DATA.slice();
  if (filter === "star") base = base.filter(d => d.star);
  else if (filter === "unknown") base = base.filter(d => !known[d.n]);
  if (filter === "shuffle") {
    base = DATA.slice();
    for (let i = base.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [base[i], base[j]] = [base[j], base[i]];
    }
  }
  deck = base;
  if (deck.length === 0) deck = DATA.slice();
  idx = 0;
}

function render() {
  card.classList.remove('flipped');
  const d = deck[idx];
  document.getElementById('frontNum').textContent = "No. " + d.n + (d.star ? "  ★" : "");
  document.getElementById('frontCat').textContent = d.c;
  document.getElementById('qText').textContent = d.q;
  document.getElementById('backNum').textContent = "No. " + d.n;
  document.getElementById('backStar').textContent = d.star ? "★ 65/20" : "";
  let html = "<ul>" + d.a.map(x => "<li>" + x + "</li>").join("") + "</ul>";
  if (d.note) html += "<div class='a-note'>" + d.note + "</div>";
  document.getElementById('aList').innerHTML = html;

  document.getElementById('meta').textContent =
    "Card " + (idx + 1) + " of " + deck.length + "  \u00b7  " +
    Object.keys(known).length + " marked as known";
  document.getElementById('progress').style.width = ((idx + 1) / deck.length * 100) + "%";

  const knowBtn = document.getElementById('know');
  knowBtn.classList.toggle('marked', !!known[d.n]);
  knowBtn.textContent = known[d.n] ? "Known ✓" : "Got it ✓";

  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === deck.length - 1;
}

cardInner.addEventListener('click', () => card.classList.toggle('flipped'));
document.getElementById('prev').addEventListener('click', () => { if (idx > 0) { idx--; render(); }});
document.getElementById('next').addEventListener('click', () => { if (idx < deck.length - 1) { idx++; render(); }});
document.getElementById('know').addEventListener('click', () => {
  const n = deck[idx].n;
  if (known[n]) delete known[n]; else known[n] = true;
  saveState();
  render();
});

document.querySelectorAll('.seg').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.seg').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    saveState();
    buildDeck();
    render();
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { if (idx < deck.length - 1) { idx++; render(); }}
  else if (e.key === 'ArrowLeft') { if (idx > 0) { idx--; render(); }}
  else if (e.key === ' ') { e.preventDefault(); card.classList.toggle('flipped'); }
});

document.getElementById('foot').innerHTML =
  "Pass: answer 12 of 20 correctly \u00b7 65/20 applicants answer 6 of 10 starred (★) questions<br>" +
  "★ questions and \u201ccurrent official\u201d answers may change \u2014 always verify at uscis.gov/citizenship/testupdates";

document.getElementById('reset').addEventListener('click', () => {
  if (confirm("Clear all saved progress? This cannot be undone.")) {
    known = {};
    filter = "all";
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    document.querySelectorAll('.seg').forEach(b =>
      b.classList.toggle('active', b.dataset.filter === "all"));
    buildDeck();
    render();
  }
});

loadState();
document.querySelectorAll('.seg').forEach(b =>
  b.classList.toggle('active', b.dataset.filter === filter));
buildDeck();
render();
</script>
